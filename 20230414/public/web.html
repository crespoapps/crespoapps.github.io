<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AR Photo Booth</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>

    <style>
        :root { --accent: #00d2ff; --bg: #0f0f0f; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        
        .viewport-container { position: relative; border: 4px solid #333; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        video { display: none; } /* Raw video is hidden, we use the canvas */
        canvas { width: 640px; height: 480px; max-width: 100%; display: block; }

        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10rem; font-weight: 900; z-index: 10; color: white; text-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: none; }
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
        .flash-active { animation: flash-anim 0.3s ease-out; }
        @keyframes flash-anim { 0% { background: white; opacity: 1; } 100% { background: transparent; opacity: 0; } }

        .controls { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        button, label { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; background: #2f3542; color: white; transition: 0.3s ease; }
        button:hover { background: var(--accent); color: black; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .snap-btn { background: #ff4757; }
        .rec-btn { background: #ffa502; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 1100px; margin-top: 40px; border-top: 1px solid #333; padding-top: 30px; }
        .gallery-item { border-radius: 10px; overflow: hidden; background: #1a1a1a; transition: 0.3s; position: relative; }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .gallery-item img, .gallery-item video { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    <h1>AI Lens Studio</h1>

    <div class="viewport-container">
        <div id="countdown"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="controls">
        <button onclick="setFilter('none')">Standard</button>
        <button onclick="setFilter('grayscale(1)')">Noir</button>
        <button onclick="setFilter('sepia(1)')">Retro</button>
        <button onclick="setFilter('hue-rotate(90deg)')">Acid</button>
        <button class="snap-btn" id="snapBtn" onclick="runCountdown()">📸 Photo</button>
        <button class="rec-btn" id="recBtn" onclick="recordVideo()">🎥 5s Clip</button>
        <label>🖼️ BG: <input type="file" id="bg-upload" hidden onchange="handleBG(event)"></label>
    </div>

    <div class="gallery-grid" id="gallery"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const shutter = new Audio('https://www.soundjay.com/mechanical/camera-shutter-click-08.mp3');
        
        let filter = 'none';
        let bgImg = null;
        let detector = null;
        let sticker = new Image();
        sticker.src = 'https://i.imgur.com/39A4D3m.png'; // Sunglasses

        async function init() {
            // 1. Setup Camera
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;

            // 2. Load Face AI
            const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
            detector = await faceLandmarksDetection.createDetector(model, {
                runtime: 'mediapipe',
                solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh'
            });

            render();
        }

        function setFilter(f) { filter = f; }
        
        function handleBG(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { bgImg = new Image(); bgImg.src = ev.target.result; };
            reader.readAsDataURL(e.target.files[0]);
        }

        async function render() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            // Background
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Temp canvas for Chromakey/Mirroring
            const temp = document.createElement('canvas');
            temp.width = canvas.width; temp.height = canvas.height;
            const tCtx = temp.getContext('2d');
            tCtx.translate(canvas.width, 0);
            tCtx.scale(-1, 1);
            tCtx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Chroma Key Logic
            if (bgImg) {
                let frame = tCtx.getImageData(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < frame.data.length; i += 4) {
                    if (frame.data[i+1] > 100 && frame.data[i+1] > frame.data[i] * 1.3) frame.data[i+3] = 0;
                }
                tCtx.putImageData(frame, 0, 0);
            }

            // Apply Filters & Draw Person
            ctx.filter = filter;
            ctx.drawImage(temp, 0, 0);
            ctx.filter = 'none';

            // Face Tracking (Stickers)
            if (detector && video.readyState >= 2) {
                const faces = await detector.estimateFaces(video, { flipHorizontal: true });
                if (faces.length > 0) {
                    const nose = faces[0].keypoints[168]; // Bridge of nose
                    const left = faces[0].keypoints[33];
                    const right = faces[0].keypoints[263];
                    const width = Math.abs(right.x - left.x) * 2.5;
                    ctx.drawImage(sticker, nose.x - width/2, nose.y - width/4, width, width/2);
                }
            }

            requestAnimationFrame(render);
        }

        function runCountdown() {
            let time = 3;
            const el = document.getElementById('countdown');
            const itv = setInterval(() => {
                el.innerText = time || "📸";
                if (time < 0) {
                    clearInterval(itv); el.innerText = "";
                    shutter.play();
                    document.getElementById('flash-overlay').classList.add('flash-active');
                    setTimeout(() => document.getElementById('flash-overlay').classList.remove('flash-active'), 300);
                    saveToGallery(canvas.toDataURL(), 'img');
                }
                time--;
            }, 800);
        }

        async function recordVideo() {
            const btn = document.getElementById('recBtn');
            btn.disabled = true;
            const stream = canvas.captureStream(30);
            const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                saveToGallery(URL.createObjectURL(new Blob(chunks, {type:'video/webm'})), 'video');
                btn.disabled = false;
            };
            rec.start();
            setTimeout(() => rec.stop(), 5000);
        }

        function saveToGallery(src, type) {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            const el = document.createElement(type);
            el.src = src;
            if (type === 'video') el.controls = true;
            el.onclick = () => { const a = document.createElement('a'); a.href = src; a.download = `snap-${Date.now()}`; a.click(); };
            div.appendChild(el);
            document.getElementById('gallery').prepend(div);
        }

        init();
    </script>
</body>
</html>
