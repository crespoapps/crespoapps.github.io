<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio | Production Suite</title>
    <style>
        :root { --accent: #00ff41; --glass: rgba(15, 15, 15, 0.95); --red: #ff4757; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', 'Segoe UI', sans-serif; }
        
        #canvas-wrapper { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; perspective: 1000px; overflow: hidden; }
        #mainCanvas { width: 100vw; height: 100vh; object-fit: cover; transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        video { display: none; }
        
        /* Hardware Accelerated Effects */
        .fisheye-active { transform: scale(1.4) translateZ(150px); border-radius: 30% !important; }
        .toon-active { filter: saturate(2.5) contrast(1.5) brightness(1.1); }
        .ripple-active { filter: url(#rippleFilter); }

        /* Polaroid Capture UI */
        #polaroid-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: #fff; padding: 12px 12px 80px 12px; box-shadow: 0 30px 90px rgba(0,0,0,0.9);
            transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1); z-index: 4000; pointer-events: none;
        }
        #polaroid-container.active { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
        #polaroid-img { width: 320px; height: 320px; object-fit: cover; background: #000; }

        /* Modern Toolbar */
        .toolbar { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; border-radius: 40px; 
            background: var(--glass); backdrop-filter: blur(25px); z-index: 1000; 
            border: 1px solid rgba(255,255,255,0.1); justify-content: center; width: 90%; max-width: 850px;
        }
        button, input { 
            padding: 12px 18px; border-radius: 25px; border: none; font-weight: 700; 
            cursor: pointer; background: #222; color: #fff; font-size: 11px; 
            text-transform: uppercase; letter-spacing: 0.5px; transition: 0.3s;
        }
        input[type="text"] { background: rgba(255,255,255,0.08); width: 140px; cursor: text; border: 1px solid transparent; }
        input[type="text"]:focus { border-color: var(--accent); outline: none; }
        .btn-active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        
        #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 3000; }
        .flash-active { animation: flashAnim 0.4s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="rippleFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="1" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div id="flash"></div>
    <div id="polaroid-container"><img id="polaroid-img" src=""></div>

    <div id="canvas-wrapper">
        <canvas id="mainCanvas"></canvas>
    </div>
    <video id="video" autoplay playsinline></video>

    <div class="toolbar">
        <input type="text" placeholder="CAPTION..." oninput="mText=this.value.toUpperCase()">
        <button id="s2Btn" onclick="toggleMode('split2')">2-Split</button>
        <button id="s4Btn" onclick="toggleMode('split4')">4-Split</button>
        <button id="ripBtn" onclick="toggleRipple()">Ripple</button>
        <button id="pxBtn" onclick="isPixel=!isPixel; this.classList.toggle('btn-active')">Pixel</button>
        <button id="fBtn" onclick="toggleFish()">FishEye</button>
        <button id="tBtn" onclick="toggleToon()">Cartoon</button>
        <button id="nBtn" onclick="isNoir=!isNoir; this.classList.toggle('btn-active')">Noir</button>
        <button style="background:var(--red)" onclick="snap()">📸 SNAP</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const rippleTurbulence = document.querySelector('#rippleFilter feTurbulence');
        let mText = "", isNoir = false, isPixel = false, isRipple = false, splitMode = 'none', rippleSeed = 0;

        const pixCanvas = document.createElement('canvas');
        const pixCtx = pixCanvas.getContext('2d');

        function toggleMode(mode) {
            splitMode = (splitMode === mode) ? 'none' : mode;
            document.getElementById('s2Btn').className = splitMode === 'split2' ? 'btn-active' : '';
            document.getElementById('s4Btn').className = splitMode === 'split4' ? 'btn-active' : '';
        }

        function toggleRipple() {
            isRipple = !isRipple;
            canvas.classList.toggle('ripple-active');
            document.getElementById('ripBtn').classList.toggle('btn-active');
        }

        function toggleFish() { canvas.classList.toggle('fisheye-active'); document.getElementById('fBtn').classList.toggle('btn-active'); }
        function toggleToon() { canvas.classList.toggle('toon-active'); document.getElementById('tBtn').classList.toggle('btn-active'); }

        async function init() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                render();
            };
            window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        }

        function drawLayer(tCtx, w, h) {
            const vSc = Math.max(w/video.videoWidth, h/video.videoHeight);
            const vW = video.videoWidth * vSc, vH = video.videoHeight * vSc;
            const vX = (w - vW) / 2, vY = (h - vH) / 2;

            if (splitMode === 'split2') {
                tCtx.save(); tCtx.beginPath(); tCtx.rect(0, 0, w / 2, h); tCtx.clip();
                tCtx.drawImage(video, vX, vY, vW, vH); tCtx.restore();
                tCtx.save(); tCtx.beginPath(); tCtx.rect(w / 2, 0, w / 2, h); tCtx.clip();
                tCtx.translate(w, 0); tCtx.scale(-1, 1); tCtx.drawImage(video, vX, vY, vW, vH); tCtx.restore();
            } else if (splitMode === 'split4') {
                const hW = w / 2, hH = h / 2;
                const vSc4 = Math.max(hW/video.videoWidth, hH/video.videoHeight);
                const qW = video.videoWidth * vSc4, qH = video.videoHeight * vSc4;
                const qX = (hW - qW) / 2, qY = (hH - qH) / 2;
                const quad = (tx, ty, sx, sy) => {
                    tCtx.save(); tCtx.translate(tx, ty); tCtx.scale(sx, sy);
                    tCtx.beginPath(); tCtx.rect(0, 0, hW, hH); tCtx.clip();
                    tCtx.drawImage(video, qX, qY, qW, qH); tCtx.restore();
                };
                quad(hW, 0, -1, 1); quad(hW, 0, 1, 1); quad(hW, h, -1, -1); quad(hW, h, 1, -1);
            } else {
                tCtx.save(); tCtx.translate(w, 0); tCtx.scale(-1, 1);
                tCtx.drawImage(video, vX, vY, vW, vH); tCtx.restore();
            }
        }

        function render() {
            // Animate Ripple if active
            if (isRipple) {
                rippleSeed += 0.05;
                rippleTurbulence.setAttribute('baseFrequency', 0.01 + Math.sin(rippleSeed) * 0.005);
            }

            ctx.filter = isNoir ? 'grayscale(100%) contrast(150%)' : 'none';
            ctx.imageSmoothingEnabled = !isPixel;

            if (isPixel) {
                const size = 70; 
                pixCanvas.width = size; pixCanvas.height = size * (canvas.height / canvas.width);
                drawLayer(pixCtx, pixCanvas.width, pixCanvas.height);
                ctx.drawImage(pixCanvas, 0, 0, canvas.width, canvas.height);
            } else {
                drawLayer(ctx, canvas.width, canvas.height);
            }

            if (mText) {
                const f = canvas.width/20; ctx.font = `bold ${f}px Impact`; ctx.textAlign = 'center';
                ctx.fillStyle = 'white'; ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
                ctx.strokeText(mText, canvas.width/2, f + 45); ctx.fillText(mText, canvas.width/2, f + 45);
            }

            // High-Contrast Digital Timestamp
            const d = new Date();
            const ts = `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear().toString().slice(-2)}  ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
            ctx.font = 'bold 18px monospace'; ctx.fillStyle = 'rgba(255, 140, 0, 0.9)';
            ctx.textAlign = 'right'; ctx.fillText(ts, canvas.width - 25, canvas.height - 25);

            requestAnimationFrame(render);
        }

        function snap() {
            document.getElementById('flash').classList.add('flash-active');
            setTimeout(() => document.getElementById('flash').classList.remove('flash-active'), 300);
            document.getElementById('polaroid-img').src = canvas.toDataURL('image/png');
            document.getElementById('polaroid-container').classList.add('active');
            setTimeout(() => document.getElementById('polaroid-container').classList.remove('active'), 5000);
        }
        init();
    </script>
</body>
</html>
