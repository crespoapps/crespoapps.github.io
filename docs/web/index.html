<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio | Polaroid Edition</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root { --accent: #00d2ff; --glass: rgba(0,0,0,0.85); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: white; }
        
        #mainCanvas { width: 100vw; height: 100vh; object-fit: cover; display: block; }
        video { display: none; }
        
        /* Polaroid Preview Logic */
        #polaroid-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0) rotate(-10deg);
            background: #fff; padding: 15px 15px 60px 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 4000; pointer-events: none;
        }
        #polaroid-container.active { transform: translate(-50%, -50%) scale(1) rotate(2deg); opacity: 1; }
        #polaroid-container.exit { transform: translate(-50%, -150%) scale(0.5) rotate(15deg); opacity: 0; }
        #polaroid-img { width: 300px; height: 300px; object-fit: cover; display: block; border: 1px solid #eee; }

        /* General UI */
        #loader { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 3000; }
        .flash-active { animation: flashAnim 0.4s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        .toolbar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 12px 20px; border-radius: 50px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        button, input { padding: 10px 18px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; background: #222; color: white; font-size: 11px; }
        input { cursor: text; background: rgba(255,255,255,0.1); width: 100px; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>
    <div id="flash"></div>

    <div id="polaroid-container">
        <img id="polaroid-img" src="">
    </div>

    <canvas id="mainCanvas"></canvas>
    <video id="video" autoplay playsinline></video>

    <div class="toolbar">
        <input type="text" id="memeText" placeholder="CAPTION..." oninput="mText=this.value.toUpperCase()">
        <button onclick="sMode='shades'">🕶️ Shades</button>
        <button onclick="sMode='glow'">🌈 Glow</button>
        <button id="snapBtn" style="background:#ff4757" onclick="snap()">📸 SNAP</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        let sMode='glow', faceResults = null, mText = "";

        // Procedural Glasses
        function drawShades(x, y, size) {
            ctx.fillStyle = "rgba(15,15,15,0.98)";
            ctx.beginPath();
            ctx.roundRect(x - size*0.48, y - size*0.1, size*0.42, size*0.25, 5);
            ctx.roundRect(x + size*0.06, y - size*0.1, size*0.42, size*0.25, 5);
            ctx.fill();
        }

        async function init() {
            const faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
            faceMesh.onResults(res => faceResults = res);
            new Camera(video, { onFrame: async () => await faceMesh.send({image: video}), width: 1280, height: 720 }).start()
                .then(() => { 
                    document.getElementById('loader').remove(); 
                    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                    window.onresize(); render();
                });
        }

        function render() {
            const vSc = Math.max(canvas.width/video.videoWidth, canvas.height/video.videoHeight);
            const vW = video.videoWidth*vSc, vH = video.videoHeight*vSc;
            const vX = (canvas.width-vW)/2, vY = (canvas.height-vH)/2;
            
            ctx.save();
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, vX, vY, vW, vH);
            ctx.restore();

            if (faceResults && faceResults.multiFaceLandmarks.length > 0) {
                const k = faceResults.multiFaceLandmarks[0];
                const mX = (x) => canvas.width - ((x * video.videoWidth * vSc) + vX);
                const mY = (y) => (y * video.videoHeight * vSc) + vY;
                const size = Math.abs(mX(k[263].x) - mX(k[33].x)) * 2.5;

                if (sMode === 'shades') drawShades(mX(k[1].x), mY(k[1].y), size);
                if (sMode === 'glow') {
                    const hue = Math.abs(k[13].y - k[14].y) * 2500;
                    [k[468], k[473]].forEach(i => {
                        ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = `hsl(${hue},100%,60%)`;
                        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(mX(i.x), mY(i.y), 6, 0, 7); ctx.fill(); ctx.restore();
                    });
                }
            }

            // Fixed Meme Text logic
            if (mText) { 
                ctx.font = `bold ${canvas.width / 18}px Impact`; 
                ctx.textAlign = 'center'; 
                ctx.fillStyle = 'white'; 
                ctx.strokeStyle = 'black'; 
                ctx.lineWidth = 3; 
                ctx.strokeText(mText, canvas.width / 2, canvas.height - 60); 
                ctx.fillText(mText, canvas.width / 2, canvas.height - 60); 
            }

            requestAnimationFrame(render);
        }

        function snap() {
            // Flash feedback
            const flash = document.getElementById('flash');
            flash.classList.add('flash-active');
            setTimeout(() => flash.classList.remove('flash-active'), 400);

            // Capture and show Polaroid
            const data = canvas.toDataURL('image/png');
            const container = document.getElementById('polaroid-container');
            const img = document.getElementById('polaroid-img');
            
            img.src = data;
            container.classList.remove('exit');
            container.classList.add('active');

            // 5 second delay then disappear
            setTimeout(() => {
                container.classList.remove('active');
                container.classList.add('exit');
            }, 5000);
        }

        init();
    </script>
</body>
</html>
